<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃什么 · 冒烟测试</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { display: block; width: 100vw; height: 100vh; border: 0; }
  #drivelog {
    position: fixed; inset: 0 0 auto 0; z-index: 99999;
    margin: 0; padding: 6px 10px; max-width: 100%;
    max-height: 46vh; overflow: hidden;
    font: 12px/1.5 Consolas, "Courier New", monospace;
    color: #7cff9b; background: rgba(0, 0, 0, .86);
    white-space: pre-wrap; pointer-events: none;
  }
</style>
</head>
<body>
<!--
  冒烟测试驱动器：把真实的 index.html 装进 iframe，用「真实点击」跑一遍关键流程，
  把每一步的断言打印到左上角，方便用 headless 截图/导出来核对。

  用法（先起一个静态服务器）：
    python -m http.server 8765
    node tools/smoke/run.js draw-where
    node tools/smoke/run.js --all

  可用 step：
    gate      仅看首次进入引导
    reload    同一浏览器 profile 下第二次打开，验证自动读取本地数据
    draw-where / what / follow   三种抽取
    origin / origin-what / origin-tight   出发地：正常 / 抽档口 / 附近没食堂时的退化
    places    地点编辑器：改名、新增、勾「离哪近」、删除地点后的悬空引用清理
    legacy    v2 老数据的升级（自动补地点 + 按名字补「离哪近」）
    editor / roster / share / bulk / theme / switches / import / badimport / empty
    galaxy / galaxy-narrow / galaxy-many   清单星系的排布断言（不重叠 / 不越界）

  额外查询参数：
    vw=<px>   把 iframe 宽度设成指定值，用来模拟窄屏
    scroll=1  每一步顺带滚到目标附近（截图用）
    fx=off    关掉背景动效，让 headless 的虚拟时间预算不被 rAF 吃光
    nolog=1   跑完把调试浮层藏掉（只截图时用，--dump-dom 抓断言时不要加）
    expect=<id> 仅 reload 步骤用：断言上次退出时存的出发地就是它
-->
<iframe id="fr" src="../../index.html"></iframe>
<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var step = Q.get('step') || 'gate';
  var fr = document.getElementById('fr');

  // 在 load 之前就把宽度定下来，页面首帧量到的就是窄屏尺寸
  if (Q.get('vw')) fr.style.width = Q.get('vw') + 'px';

  // 截图用：等断言都打印完了再把浮层藏掉，别挡住页面
  if (Q.get('nolog')) {
    setTimeout(function () {
      var p = document.getElementById('drivelog');
      if (p) p.style.display = 'none';
    }, 3000);
  }

  function show(txt) {
    var p = document.getElementById('drivelog');
    if (!p) { p = document.createElement('pre'); p.id = 'drivelog'; document.body.appendChild(p); }
    p.textContent += txt + '\n';
  }

  fr.addEventListener('load', function () {
    var w = fr.contentWindow, d = fr.contentDocument, WTE = w.WTE;
    var log = show;
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function q(sel) { return d.querySelector(sel); }
    function qa(sel) { return [].slice.call(d.querySelectorAll(sel)); }
    function toastText() {
      return qa('.toast').map(function (t) { return t.textContent.trim(); }).join(' ; ') || '-';
    }
    async function reveal(sel) {
      if (!Q.get('scroll')) return;
      d.documentElement.style.scrollBehavior = 'auto';
      w.scrollTo(0, Math.max(0, (q(sel) ? q(sel).getBoundingClientRect().top + w.scrollY - 8 : 0)));
      await sleep(500);
      w.scrollTo(0, Math.max(0, (q(sel) ? q(sel).getBoundingClientRect().top + w.scrollY - 8 : 0)));
      await sleep(300);
    }
    async function skipGate() {
      q('#gate [data-act="gate-skip"]').click();
      await sleep(120);
      log('bar=' + q('#bar-sub').textContent);
      log('stats=' + JSON.stringify(WTE.store.stats()));
      log('orbitNodes=' + qa('.orbit__node').length);
      if (Q.get('fx') === 'off') {
        // 关掉背景动效，避免无限 rAF 循环吃掉 headless 的虚拟时间预算
        WTE.store.mutate(function (st) { st.theme.fx = 'off'; });
        WTE.ui.applyTheme();
      }
    }

    /* 量化“挤不挤”：
       用布局盒（offsetLeft/offsetWidth，不受 inline rotate 影响）算
       两两“中心距 − 半径和”，负数就是重叠。 */
    function galaxyReport(tag) {
      var g = q('#galaxy');
      var nodes = qa('#galaxy .node');
      var boxes = nodes.map(function (n) {
        return {
          x: n.offsetLeft + n.offsetWidth / 2,
          y: n.offsetTop + n.offsetHeight / 2,
          s: n.offsetWidth,
          l: n.offsetLeft, t: n.offsetTop, w: n.offsetWidth, h: n.offsetHeight
        };
      });
      var minGap = Infinity, worst = '-';
      for (var i = 0; i < boxes.length; i++) {
        for (var j = i + 1; j < boxes.length; j++) {
          var A = boxes[i], B = boxes[j];
          var gap = Math.sqrt((A.x - B.x) * (A.x - B.x) + (A.y - B.y) * (A.y - B.y)) - (A.s + B.s) / 2;
          if (gap < minGap) { minGap = gap; worst = i + '-' + j; }
        }
      }
      var out = 0;
      boxes.forEach(function (b) {
        if (b.l < -0.5 || b.t < -0.5 ||
            b.l + b.w > g.clientWidth + 0.5 || b.t + b.h > g.clientHeight + 0.5) out++;
      });
      var sizes = boxes.map(function (b) { return b.s; });
      log(tag + ' nodes=' + nodes.length +
          ' size=' + (sizes.length ? Math.min.apply(null, sizes) + '~' + Math.max.apply(null, sizes) : '-') +
          ' minGap=' + (minGap === Infinity ? 'n/a' : minGap.toFixed(1)) + ' worst=' + worst +
          ' out=' + out + ' canvas=' + (g.style.height || '-') +
          ' host=' + g.parentNode.clientWidth + 'x' + g.parentNode.clientHeight);
      log(tag + ' VERDICT=' + ((minGap > 0 && out === 0) ? 'OK' : 'SQUEEZED'));
    }

    (async function () {
      try {
        log('step=' + step);
        log('boot=' + d.body.dataset.boot + ' err=' + (d.body.dataset.error || '-'));

        if (step === 'gate') { log('gateHidden=' + q('#gate').hidden); return; }

        if (step === 'reload') {
          var rst = WTE.store.get();
          var expOrigin = Q.get('expect');   // 例如 p-jxg：上一次开页时选的出发地
          log('reload: gateHidden=' + q('#gate').hidden);
          log('reload: hasStored=' + WTE.store.hasStored() + ' seen=' + WTE.store.seen());
          log('reload: bar=' + q('#bar-sub').textContent);
          log('reload: canteens=' + rst.canteens.length + ' places=' + rst.places.length + ' origin=' + rst.origin);
          log('reload: railOn=' + (qa('#origin-rail .is-on').map(function (c) {
            return c.getAttribute('data-pid') || '(any)';
          }).join(',') || '-'));
          log('persist VERDICT=' + ((rst.canteens.length >= 16 &&
              rst.places.length >= 11 &&
              (!expOrigin || rst.origin === expOrigin)) ? 'OK' : 'MISS'));
          return;
        }

        await skipGate();
        log('gateHidden=' + q('#gate').hidden);

        if (step === 'home') return;

        if (step === 'draw-where' || step === 'follow') {
          WTE.ui.setMode('where');
          await WTE.ui.performDraw('where');
          await sleep(200);
          var r = WTE.ui.state.result;
          log('mode=' + r.mode + ' luck=' + r.luck + ' label=' + r.label.label);
          log('picks=' + r.picks.map(function (p) {
            return p.role + ':' + (p.stall ? p.stall.name : (p.canteen ? p.canteen.name : 'null'));
          }).join(' | '));
          log('cards=' + qa('.pick').length + ' title=' + (q('.result__title') || {}).textContent);
          await reveal('.result');
          if (step !== 'follow') return;

          var btn = q('[data-act="followup"]');
          log('followupBtn=' + !!btn);
          if (btn) { btn.click(); await sleep(2400); }
          log('2nd mode=' + WTE.ui.state.result.mode + ' picks=' + WTE.ui.state.result.picks.map(function (p) {
            return p.role + ':' + (p.stall ? p.stall.name + '@' + p.canteen.name : 'null');
          }).join(' | '));
          q('[data-act="reroll"]').click();
          await sleep(220);
          log('afterReroll=' + WTE.ui.state.result.picks.map(function (p) {
            return p.role + ':' + (p.stall ? p.stall.name : 'null');
          }).join(' | '));
          await reveal('.result');
          return;
        }

        if (step === 'draw-what') {
          WTE.ui.setMode('what');
          await WTE.ui.performDraw('what');
          await sleep(200);
          var rw = WTE.ui.state.result;
          log('mode=' + rw.mode + ' luck=' + rw.luck + ' ' + rw.label.label);
          log('picks=' + rw.picks.map(function (p) {
            return p.role + ':' + (p.stall ? p.stall.name + '@' + p.canteen.name : 'null');
          }).join(' | '));
          await reveal('.result');
          return;
        }

        if (step === 'editor') {
          q('#btn-settings').click();
          await sleep(100);
          q('[data-tab="data"]').click();
          await sleep(80);
          log('editorCards=' + qa('.canteen').length);
          q('.canteen [data-act="canteen-toggle"]').click();
          await sleep(80);
          log('openBody=' + qa('.canteen.is-open').length + ' stalls=' + qa('.stall').length);
          q('[data-act="add-canteen"]').click();
          await sleep(80);
          log('afterAdd=' + qa('.canteen').length + ' total=' + WTE.store.get().canteens.length);
          return;
        }

        if (step === 'roster') {
          q('#btn-roster').click();
          await sleep(220);
          log('rosterOpen=' + q('#panel-roster').classList.contains('is-open'));
          log('nodes=' + qa('.node').length + ' bursts=' + qa('.node__burst').length);
          return;
        }

        if (step === 'galaxy' || step === 'galaxy-narrow' || step === 'galaxy-many') {
          if (step === 'galaxy-many') {
            // 压测：把食堂数堆到 ~37 个，看排布会不会开始互相压住
            WTE.store.mutate(function (st) {
              var seed = st.canteens.slice(0, 6);
              for (var k = 0; k < 4; k++) {
                seed.forEach(function (c) {
                  var copy = JSON.parse(JSON.stringify(c));
                  copy.name = c.name + '·' + (k + 2) + '号店';
                  copy.id = 'many-' + k + '-' + c.id;
                  copy.stalls.forEach(function (s, si) { s.id = copy.id + '-s' + si; });
                  st.canteens.push(copy);
                });
              }
            });
          }
          q('#btn-roster').click();
          await sleep(340);
          log('rosterOpen=' + q('#panel-roster').classList.contains('is-open'));
          var hostEl = q('#galaxy').parentNode;
          function geom() {
            var g = WTE.ui.galaxyGeom;
            return g ? ('hAvail=' + g.hAvail + ' a=' + g.a.toFixed(1) + ' b=' + g.b.toFixed(1) +
                        ' d=' + g.d.toFixed(1) + ' gap=' + g.gap.toFixed(1) + ' n=' + g.n) : 'null';
          }
          log('hostAfterOpen=' + hostEl.clientWidth + 'x' + hostEl.clientHeight + ' ' + geom());
          galaxyReport('L1');
          // 重渲染一次（模拟改个字/改主题），确认落点是稳定的、不会乱跳
          var before = qa('#galaxy .node').map(function (n) { return n.offsetLeft + ',' + n.offsetTop; }).join('|');
          WTE.ui.renderGalaxy();
          await sleep(60);
          var after = qa('#galaxy .node').map(function (n) { return n.offsetLeft + ',' + n.offsetTop; }).join('|');
          log('hostAfterRerender=' + hostEl.clientWidth + 'x' + hostEl.clientHeight + ' ' + geom());
          log('stableAcrossRerender=' + (before === after));
          galaxyReport('L2');
          return;
        }

        if (step === 'origin' || step === 'origin-tight' || step === 'origin-what' || step === 'origin-narrow') {
          var rail = qa('#origin-rail .origin__chip');
          log('railChips=' + rail.length + ' places=' + WTE.store.get().places.length);
          log('anyChip=' + (rail[0] ? rail[0].textContent.trim() : '-'));
          log('defaultOn=' + ((q('#origin-rail .is-on') || {}).textContent || '-').trim());
          log('defaultOrigin=' + JSON.stringify(WTE.store.get().origin));

          var target = 'p-jxg';   // 教学馆
          if (step === 'origin-tight') {
            // 造一个没有任何食堂挂着的地点：抽取应该优雅退化成整份清单 + 给提示
            WTE.store.mutate(function (st) {
              st.places.push({ id: 'p-nobody', name: '荒岛', emoji: '🏝️', area: '' });
            }, { noEmit: true });
            // noEmit 不会触发重渲染，得手动把新地点画进出发地线路
            WTE.ui.renderOrigin();
            await sleep(60);
            target = 'p-nobody';
          }

          var chip = q('#origin-rail [data-pid="' + target + '"]');
          log('chipFound=' + !!chip);
          chip.click();
          await sleep(140);
          log('afterPick origin=' + WTE.store.get().origin + ' ui=' + WTE.ui.state.origin);
          log('hint=' + q('#origin-hint').textContent);
          // 注意：setOrigin 之后整条线路会重建，得重新取节点，别读旧引用
          var chip2 = q('#origin-rail [data-pid="' + target + '"]');
          log('chipOn=' + chip2.classList.contains('is-on') + ' ariaChecked=' + chip2.getAttribute('aria-checked') +
              ' onCount=' + qa('#origin-rail .is-on').length);

          var mode = step === 'origin-what' ? 'what' : 'where';
          WTE.ui.setMode(mode);
          await WTE.ui.performDraw(mode);
          await sleep(220);

          var r = WTE.ui.state.result;
          var realPicks = r.picks.filter(function (p) { return p.canteen; });
          var hits = realPicks.filter(function (p) {
            return (p.canteen.near || []).indexOf(target) >= 0;
          }).length;
          log('mode=' + r.mode + ' result.origin=' + r.origin);
          log('picks=' + r.picks.map(function (p) {
            return p.role + ':' + (p.stall ? p.stall.name + '@' + p.canteen.name : (p.canteen ? p.canteen.name : 'null'));
          }).join(' | '));
          log('nearHits=' + hits + '/' + realPicks.length);
          log('warnings=' + (r.warnings.join(' / ') || '-'));
          log('originLine=' + ((q('.result__origin') || {}).textContent || '-').trim());
          log('nearBadges=' + qa('.pick__near').length);
          var expectAll = step !== 'origin-tight';
          // tight 用例：附近 0 家 -> 优雅退化到整份清单（不该抽到「离它近」的），且必须有降级提示
          log('origin VERDICT=' + ((expectAll
              ? (hits === realPicks.length && realPicks.length >= 2)
              : (hits === 0 && realPicks.length >= 2 && r.warnings.length > 0)) ? 'OK' : 'MISS'));
          await reveal('.result');
          return;
        }

        if (step === 'places') {
          q('#btn-settings').click();
          await sleep(120);
          q('[data-tab="data"]').click();
          await sleep(140);
          log('placeboxSub=' + q('#placebox-sub').textContent);
          log('hiddenBefore=' + q('#places').hidden);
          q('[data-act="toggle-places"]').click();
          await sleep(140);
          log('hiddenAfter=' + q('#places').hidden + ' rows=' + qa('.place').length);
          log('counts=' + qa('.place__count').map(function (n) { return n.textContent; }).join(','));

          // 改一个地点的名字：结果卡 / 出发地线路都要跟着变
          var ni = q('.place[data-pid="p-jxg"] input[data-pfield="name"]');
          log('nameBefore=' + ni.value);
          ni.value = '第一教学馆';
          ni.dispatchEvent(new w.Event('change', { bubbles: true }));
          await sleep(140);
          log('nameAfter=' + WTE.store.findPlace('p-jxg').name);
          log('railLabel=' + ((q('#origin-rail [data-pid="p-jxg"] .origin__name') || {}).textContent || '-'));
          var ni2 = q('.place[data-pid="p-jxg"] input[data-pfield="name"]');
          ni2.value = '教学馆';
          ni2.dispatchEvent(new w.Event('change', { bubbles: true }));
          await sleep(100);

          // 回车新增一个地点
          var f = q('#place-add');
          f.querySelector('input[name="placeName"]').value = '图书馆';
          f.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
          await sleep(160);
          var st1 = WTE.store.get();
          log('afterAdd=' + st1.places.length + ' last=' + st1.places[st1.places.length - 1].name +
              ' railChips=' + qa('#origin-rail .origin__chip').length);

          // 给第一个食堂勾一个「离哪近」
          var cid0 = st1.canteens[0].id;
          q('.canteen[data-cid="' + cid0 + '"] [data-act="canteen-toggle"]').click();
          await sleep(140);
          var box = '.canteen[data-cid="' + cid0 + '"]';
          log('nearChips=' + qa(box + ' .near').length + ' onBefore=' + qa(box + ' .near.is-on').length);
          var off = qa(box + ' .near').filter(function (b) { return !b.classList.contains('is-on'); })[0];
          off.click();
          await sleep(160);
          var c0 = WTE.store.findCanteen(cid0);
          log('afterToggle near=' + JSON.stringify(c0.near) + ' onAfter=' + qa(box + ' .near.is-on').length);
          log('railN=' + ((q('#origin-rail [data-pid="' + off.dataset.pid + '"] .origin__n') || {}).textContent || '-'));
          log('sub=' + ((q(box + ' .canteen__sub') || {}).textContent || '-'));

          // 删掉一个地点：引用它的标记要一起清掉
          var victim = 'p-nobody';
          WTE.store.mutate(function (st) {
            st.places.push({ id: 'p-nobody', name: '临时荒岛', emoji: '🏝️', area: '' });
            st.canteens[0].near.push('p-nobody');
          }, { noEmit: true });
          WTE.ui.renderEditor();
          await sleep(100);
          w.confirm = function () { return true; };
          q('.place[data-pid="' + victim + '"] [data-act="place-del"]').click();
          await sleep(160);
          var st2 = WTE.store.get();
          log('afterDel places=' + st2.places.length + ' dangling=' +
              st2.canteens.reduce(function (n, c) {
                return n + (c.near || []).filter(function (id) { return !WTE.store.findPlace(id); }).length;
              }, 0));

          log('places VERDICT=' + ((st2.places.length === 12 &&
              !st2.canteens.some(function (c) {
                return (c.near || []).some(function (id) { return !WTE.store.findPlace(id); });
              })) ? 'OK' : 'MISS'));
          return;
        }

        if (step === 'share') {
          q('#btn-settings').click();
          await sleep(80);
          q('[data-tab="share"]').click();
          await sleep(600);
          var u = q('#share-url').value;
          log('shareLen=' + u.length + ' head=' + u.slice(0, 44));
          log('note=' + q('#share-note').textContent);
          log('storeNote=' + q('#store-note').textContent);
          var before = WTE.store.stats();
          var rt = await w.WTE.store.decodePayload(u).then(function (raw) {
            var res = w.WTE.store.normalize(raw);
            var nearN = res.state.canteens.reduce(function (n, c) { return n + (c.near || []).length; }, 0);
            return res.state.canteens.length + '/' +
              res.state.canteens.reduce(function (n, c) { return n + c.stalls.length; }, 0) +
              '/p' + res.state.places.length + '/n' + nearN;
          });
          var self = WTE.store.get();
          var selfNear = self.canteens.reduce(function (n, c) { return n + (c.near || []).length; }, 0);
          log('roundtrip=' + rt + ' original=' + before.canteens + '/' + before.stalls +
              '/p' + self.places.length + '/n' + selfNear);
          log('share VERDICT=' + (rt === (before.canteens + '/' + before.stalls + '/p' + self.places.length + '/n' + selfNear)
            ? 'OK' : 'MISS'));
          return;
        }

        if (step === 'bulk') {
          q('#btn-settings').click();
          await sleep(80);
          q('[data-tab="data"]').click();
          await sleep(60);
          q('[data-act="open-bulk"]').click();
          await sleep(60);
          q('#bulk-text').value = '测试食堂A @教学馆、综一\n- 档口1\n- 档口2\n测试食堂B > 只有这个档口\n测试食堂C @不存在的地方';
          q('[data-act="apply-bulk"]').click();
          await sleep(180);
          var st = WTE.store.get();
          var last = st.canteens[st.canteens.length - 1];
          log('total=' + st.canteens.length + ' last=' + last.name + ' [' +
              last.stalls.map(function (s) { return s.name; }).join(',') + ']');
          var a = st.canteens[st.canteens.length - 3];
          log('A=' + a.name + ' near=' + JSON.stringify(a.near));
          log('toast=' + toastText());
          log('stats=' + JSON.stringify(WTE.store.stats()));
          log('bulk VERDICT=' + ((a.near.length === 2 && last.near.length === 0) ? 'OK' : 'MISS'));
          return;
        }

        if (step === 'legacy') {
          // 模拟老版本（v2）本地数据：有大工食堂名，但完全没有 places / near
          var v2 = {
            version: 2,
            meta: { title: '今天吃什么', source: '大连理工大学 · 凌水主校区' },
            theme: { primary: '#ff3d6e' },
            canteens: [
              { id: 'c1', name: '中心食堂', stalls: [{ id: 'c1-s1', name: '麻辣香锅' }] },
              { id: 'c2', name: '沁园餐厅', stalls: [{ id: 'c2-s1', name: '牛肉面' }] },
              { id: 'c3', name: '我自己的小灶', stalls: [{ id: 'c3-s1', name: '炒饭' }] }
            ]
          };
          var lres = WTE.store.normalize(v2);
          log('places=' + lres.state.places.length + ' [' +
              lres.state.places.map(function (p) { return p.name; }).join('、') + ']');
          log('near.中心食堂=' + JSON.stringify(lres.state.canteens[0].near));
          log('near.沁园餐厅=' + JSON.stringify(lres.state.canteens[1].near));
          log('near.我自己的小灶=' + JSON.stringify(lres.state.canteens[2].near));
          log('warnings=' + lres.warnings.join(' / '));
          var legacyOk = lres.state.places.length > 0 &&
            lres.state.canteens[0].near.length > 0 &&
            lres.state.canteens[1].near.length > 0 &&
            lres.state.canteens[2].near.length === 0;
          log('legacy VERDICT=' + (legacyOk ? 'OK' : 'MISS'));

          // 反过来：名字对不上时不该凭空塞地点
          var other = WTE.store.normalize({ version: 2, canteens: [{ name: '我家楼下面馆', stalls: [{ name: '牛肉面' }] }] });
          log('otherPlaces=' + other.state.places.length);
          log('legacy2 VERDICT=' + (other.state.places.length === 0 ? 'OK' : 'MISS'));
          return;
        }

        if (step === 'theme') {
          q('[data-act="theme-preset"][data-color="#22c55e"]').click();
          await sleep(90);
          log('theme=' + WTE.store.get().theme.primary + ' --h=' + d.documentElement.style.getPropertyValue('--h'));
          q('[data-group="appearance"] [data-value="light"]').click();
          await sleep(90);
          log('appearance=' + WTE.store.get().theme.appearance);
          return;
        }

        if (step === 'switches') {
          q('#btn-settings').click();
          await sleep(140);
          var inp = q('#opt-sound');
          var knob = inp.nextElementSibling.querySelector('i');
          log('soundChecked=' + inp.checked + ' autoscrollChecked=' + q('#opt-autoscroll').checked);
          log('knobTransform=' + w.getComputedStyle(knob).transform);
          inp.click();
          await sleep(80);
          log('afterClick soundChecked=' + inp.checked + ' themeSound=' + WTE.store.get().theme.sound);
          return;
        }

        if (step === 'import') {
          q('#btn-settings').click();
          await sleep(80);
          q('[data-tab="share"]').click();
          await sleep(500);
          var link = q('#share-url').value;
          log('built=' + link.slice(0, 40) + '...');
          WTE.store.resetTo({ version: 2, canteens: [{ name: '临时食堂', stalls: [{ name: '临时档口' }] }] });
          log('afterWipe=' + WTE.store.get().canteens.length);
          q('[data-act="close-settings"]').click();
          await sleep(140);
          q('#btn-settings').click();
          await sleep(80);
          q('[data-tab="share"]').click();
          await sleep(60);
          q('#import-text').value = link;
          q('[data-act="import-text"]').click();
          await sleep(700);
          var s2 = WTE.store.stats();
          log('restored=' + s2.canteens + '/' + s2.stalls);
          log('toast=' + toastText());
          return;
        }

        if (step === 'badimport') {
          q('#btn-settings').click();
          await sleep(80);
          q('[data-tab="share"]').click();
          await sleep(60);
          q('#import-text').value = '这不是配置，只是一句话';
          q('[data-act="import-text"]').click();
          await sleep(400);
          log('toast=' + toastText());
          log('canteens=' + WTE.store.get().canteens.length);
          return;
        }

        if (step === 'empty') {
          WTE.store.mutate(function (st) { st.canteens = []; });
          await WTE.ui.performDraw('where');
          await sleep(300);
          log('toast=' + toastText());
          log('settingsOpened=' + q('#panel-settings').classList.contains('is-open'));
          return;
        }

        log('unknown step: ' + step);
      } catch (e) {
        log('EXCEPTION: ' + (e && e.message) + ' | ' + String((e && e.stack) || '').split('\n')[1]);
      }
    })();
  });
})();
</script>
</body>
</html>
